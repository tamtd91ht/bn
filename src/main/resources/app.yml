# ============================================================
# Binance Auto-Trading Bot — cấu hình chính (app.yml)
#
# ĐÂY LÀ NGUỒN CẤU HÌNH DUY NHẤT (bundled trong bot.jar qua classpath:/app.yml).
# Đã bỏ bản app.yml cạnh jar — mọi thay đổi config sửa TRỰC TIẾP file này rồi rebuild jar.
# Loader vẫn ưu tiên <thư mục chứa bot.jar>/app.yml NẾU tồn tại (escape hatch tạm thời),
# nhưng quy ước hiện tại là không tạo file ngoài đó.
#
# Per-symbol override đặt trong `symbols.yml` cạnh jar (xem ví dụ cuối file).
#
# Secrets (API keys) KHÔNG bỏ vào đây. Set qua env var:
#   BINANCE_API_KEY, BINANCE_API_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# LƯU Ý hot-reload: chỉ hoạt động khi có app.yml ngoài cạnh jar. Vì nay dùng bản bundled,
# đổi config cần rebuild + redeploy jar (hot-reload không áp dụng cho file trong jar).
# ============================================================

# Version của config — BUMP MỖI LẦN sửa file này rồi rebuild/deploy jar.
# Log ra lúc start (app.log + Telegram). Nếu app.yml ngoài cạnh jar có version
# khác bản bundled trong jar → bot in WARNING "[VERSION] ... LỆCH ..." để biết
# file config không khớp binary đang chạy.
version: "10.31.5.6.26"

# ========= EXCHANGE =========
exchange:
  # SPOT       = giao ngay (không đòn bẩy, long-only).
  # USDM_FUTURES = USDⓈ-M futures (có đòn bẩy, có thể long/short tuỳ chiến lược).
  mode: SPOT
  # true = dùng testnet (testnet.binance.vision / testnet.binancefuture.com). Key testnet khác key live.
  useTestnet: false
  # Binance reject request nếu timestamp lệch quá recvWindow. 5000ms đủ với VPS đã sync NTP.
  recvWindow: 5000
  # Đòn bẩy. SPOT luôn = 1. Futures: 1-125 (khuyến nghị ≤ 5 cho bot cá nhân).
  leverage: 1
  # Chỉ áp dụng khi mode=USDM_FUTURES.
  # ISOLATED = mỗi vị thế có margin riêng (an toàn, khuyến nghị).
  # CROSSED  = dùng chung toàn bộ số dư → thua 1 vị thế có thể kéo các vị thế khác.
  marginType: ISOLATED
  # ONE_WAY = mỗi symbol 1 chiều (khuyến nghị).
  # HEDGE   = cho phép long+short cùng symbol. Chưa hỗ trợ ở v1.
  positionMode: ONE_WAY

# ========= TÍN HIỆU (EMA/RSI) =========
signals:
  emaShort: 20
  emaLong: 50
  rsiPeriod: 14
  # Watchlist entry: chỉ mua khi RSI ∈ [rsiEntryMin, rsiEntryMax] (tránh đỉnh/trend yếu).
  rsiEntryMin: 40
  rsiEntryMax: 60                       # cũ 65 — siết để tránh mua khi RSI đã gần overbought (paper 9 ngày: nhiều entry pullback ngay)
  # Bottom reversal: RSI phải từng < rsiOversoldEnter rồi hồi qua rsiOversoldExit.
  rsiOversoldEnter: 30
  rsiOversoldExit: 35
  # |EMA20-EMA50|/giá < ngưỡng này (%) → sideway.
  sidewayEmaGapPct: 0.3
  # Số nến gần nhất để confirm slope EMA20 (regression).
  slopeConfirmBars: 3
  # STRONG_WAVE 4h: nếu RSI 4h hiện tại > X → reject (tránh mua đỉnh sóng).
  # 70 = overbought zone, 65 chặt hơn, 0 = tắt filter.
  strongWaveRsiMax: 62                  # cũ 70 — siết mạnh để tránh bắt đỉnh sóng (paper test: STRONG_WAVE pullback nhiều)

# ========= EXIT (TP/SL) =========
# Có thể override per-symbol qua symbols.yml (vd coin biến động cao muốn TP/SL xa hơn).
exit:
  takeProfitPct: 5.0               # TP lần 1 (% so giá entry)
  partialTpRatio: 0.5              # TP lần 1 và trend còn UP → bán 50%, giữ 50% chờ TP kế
  trailingTpStepPct: 3.0           # Mỗi lần partial TP, nâng ngưỡng TP kế +3%
  stopLossPct: 3.0                 # SL (% so giá entry). Hạ 4→3: data 06-04/05 avg thua -4.3% > avg thắng +2.1% → thu hẹp độ lớn mỗi lần thua.
  maxDropChecks: 2                 # Cần 2 fast-tick (~60-120s) liên tiếp dưới -SL mới bán (lọc wick đơn). Trend DOWNTREND không hồi vẫn bán ngay (PositionManager.evaluateStopLoss).
  recoveryResetPct: -2.0           # Hồi về > ngưỡng này → reset dropCheckCount (match với SL mới)
  breakevenAfterPartialTp: true    # Sau partial TP dời SL về breakeven
  cooldownAfterLossHours: 24       # Sau stop-loss không mua lại coin đó trong N giờ. Cũ 4h quá ngắn → tái nhập coin vừa thua trong cùng phiên.
  cooldownAfterWinHours: 6         # Sau TP thắng (full), cooldown N giờ chặn tái nhập cùng phiên. Data: MEME/LA thắng rồi mua lại thua ngay = -4.6 USDT. 0 = tắt.
  # --- TRAILING TP (high-water mark) ---
  # Bảo vệ lãi đã đạt khi pnl tụt khỏi đỉnh - tránh case "lên 4% rồi rơi về 0".
  # Logic: pnl từng đạt ≥ trailingArmPct (armed) AND drop từ đỉnh ≥ trailingDropPct → bán ngay.
  trailingArmPct: 3.5              # Lãi từ 3.5% mới enable trailing (cũ 3.0 — để winner chạy thêm trước khi protect)
  trailingDropPct: 1.2             # Tụt ≥ 1.2% khỏi đỉnh → SELL toàn bộ (cũ 1.5 — siết để realize gần đỉnh hơn, bù SL hẹp lại)
                                   # Cả 2 = 0 hoặc null → tắt trailing.

# ========= CAPITAL =========
capital:
  reservePct: 0.20                     # % vốn gốc giữ làm reserveFund (dùng cho scanner opportunity)
  v0SnapshotEveryHours: 24             # Mỗi 24h snapshot lại v0 (chỉ khi không có position mở)
  minTradeSizeUsdt: 10.0               # Lệnh < số này sẽ bị skip (tránh phí cao)
  reserveAllocPerOpportunityUsdt: 50.0 # Trần mỗi lần rút reserveFund vào 1 coin scanner (mixed mode)
  # Trần USDT mỗi lệnh scanner ở SCANNER-ONLY mode (watchlist rỗng). 0 = tắt → chia đều deployable/slot.
  # Giữ mỗi entry nhỏ để còn dư địa vào lệnh ở các tick sau (tránh 1 lệnh ăn gần hết deployable khi ít slot trống).
  maxAllocPerTradeUsdt: 50.0
  # --- TIME-STOP MAIN POSITION ---
  # Main position (source != STANDBY) giữ > N giờ mà PnL còn "lờ đờ" → đóng để giải phóng slot + thu hồi vốn.
  # Tránh case coin nằm im quanh 0% nhiều ngày khoá cứng slot, khiến bot bỏ lỡ tín hiệu mạnh. 0 = tắt.
  mainMaxHoldHours: 12
  # Chỉ time-stop khi PnL% < ngưỡng này (lệnh đang chạy tốt sắp TP thì để TP lo, không cắt sớm).
  mainStaleExitMaxPnlPct: 1.0
  # --- STANDBY FUND (quỹ cơ hội) ---
  # % v0 luôn carve-out, KHÔNG deploy vào main slots, chỉ dùng khi main slots đầy.
  # 0.0 = tắt tính năng standby. Khuyến nghị 0.15–0.20.
  standbyReservePct: 0.20
  # Score tối thiểu của scanner signal để trigger entry từ standby fund.
  standbyMinScore: 14.0                 # Nâng lại 11→14: BOTTOM_REVERSAL đã được lọc trend 4h ở nguồn (SignalDetector), không cần gate thấp; standby chỉ lấy UPTREND/STRONG_WAVE đủ mạnh.
  # Tối đa N vị thế standby cùng lúc.
  standbyMaxPositions: 2
  # Sau N giờ, nếu PnL >= standbyMinRecoveryPnlPct → đóng sớm để thu hồi vốn.
  standbyRecoveryHours: 4
  # PnL% tối thiểu để time-based recovery kích hoạt. 0.0 = hòa vốn là đủ.
  standbyMinRecoveryPnlPct: 0.0

# ========= RISK =========
risk:
  dailyDrawdownPct: 0.10               # Equity giảm > 10% trong ngày → kill-switch. Altcoin biến động mạnh, 5% quá chặt dễ false-trigger.
  pauseHours: 24                       # Kill-switch pause trong N giờ
  maxConcurrentPositions: 5            # 5 main slots + 2 standby = 7 vị thế tối đa. Tăng 3→5 vừa giảm vốn/lệnh (deployable/5) vừa bắt thêm tín hiệu (giảm [MISS]).
  maxPnlPctEligibleForRebalance: -100  # TẮT rebalance (đặt ngưỡng âm sâu để không position nào lọt). Paper 9 ngày: rebalance lock loss 6/6 lần = -3.82 USDT (93% realized loss). Tôn trọng SL=-3% thay vì đổi coin lock loss sớm.
  rebalanceMinHoldMinutes: 120         # Không rebalance position giữ < 2h (tránh churn mua-bán-mua)
  # --- FUTURES ONLY ---
  liquidationBufferPct: 30             # Lỗ max cho phép = 30% khoảng cách (entry → liqPrice)
  maxExposurePctOfEquity: 80           # Tổng notional mở <= 80% equity (tránh overleverage)
  fundingGuardEnabled: true
  fundingMaxAcceptablePctPer8h: 0.05   # Funding > 0.05%/8h (~5.5%/tháng) → không mở long mới
  killSwitchHysteresisTicks: 3         # Cần drawdown ≥ ngưỡng trong N tick LIÊN TIẾP mới fire.
                                       # 1 = nhạy (như cũ, dễ false trigger từ wick).
                                       # 3 = cần ~3 phút liên tục lỗ (với fastTickSeconds=60).

# ========= WATCHLIST =========
watchlist:
  buyOnStart: false                    # true = mua ngay khi start nếu thoả entry. false = chờ crossover mới.
  symbols: []                          # Để trống → bot dựa hoàn toàn scanner. Muốn ép vài coin thì thêm vào đây, vd: [SOLUSDT, AVAXUSDT]

# ========= SCANNER =========
scanner:
  enabled: true                         # false = reserveFund đóng băng, chỉ trade watchlist
  topN: 30
  minQuoteVolume24hUsdt: 5000000       # Volume 24h tối thiểu. Hạ dần 50M→30M→5M để rộng universe; chấp nhận rủi ro coin nhỏ hơn, bù bằng signal filter.
  # --- MOMENTUM TIER ---
  # Thay vì lấy toàn bộ topN theo volume (bias về large-cap ít biến động),
  # dành N slot riêng cho các coin đang có momentum 24h trong [momentumMinPct, momentumMaxPct].
  # Phần còn lại (topN - momentumSlots) vẫn lấy theo volume như cũ.
  # 0 = tắt tính năng, giữ hành vi cũ.
  momentumSlots: 10                     # 10/30 slot dành cho coin đang tăng mạnh
  momentumMinPct: 3.0                   # Tối thiểu +3% trong 24h (loại coin flat)
  momentumMaxPct: 20.0                  # Tối đa +20% (tránh coin đã pump quá muộn)
  blacklist:
    - SOLUSDT
    - XRPUSDT
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - BTCDOMUSDT
    - USDCUSDT
    - FDUSDUSDT
    - BUSDUSDT
    - TUSDUSDT
    - USD1USDT
    - RLUSDUSDT
    - EURUSDT       # Cặp ngoại hối EUR/USD, biến động <0.5%/ngày — không hợp altcoin strategy TP 5%/SL 3%

# ========= TIMEFRAMES =========
timeframes:
  primary: 1h                           # 15m | 30m | 1h | 2h | 4h
  confirm: 4h                           # Xác nhận trend lớn cho scanner

# ========= SCHEDULING =========
scheduling:
  tickMinutes: 5                        # Chu kỳ tick chính (check TP/SL/scan + scanner + entry). Giảm 15→5 để bắt signal sớm hơn sau candle 1h đóng.
  fastTickSeconds: 60                   # Fast loop chỉ check positions (TP/SL) mỗi N giây.
                                        # 0 = tắt → chỉ tick chính như v1. Khuyến nghị 60s để
                                        # SL phản ứng nhanh khi giá dump (tránh case lệch -3% như APE).
                                        # Mỗi fast-tick tốn ~30 weight (1 ticker + 1 klines /position).
  entryGracePeriodSeconds: 120          # Sau entry, skip SL check trong N giây để tránh fast-tick
                                        # bán ngay nếu giá slip lúc fill. 0 = check ngay.
  cleanupHourVN: 2                      # Giờ (VN) xoá JSONL cũ
  dailyReportHourVN: 8                  # Giờ (VN) gửi báo cáo Telegram

# ========= STORAGE =========
storage:
  dataDir: ./data                       # state.json + trades/orders/signals/equity jsonl
  keepDays: 30

# ========= LOGGING =========
logging:
  console: true
  file: true
  level: INFO                           # DEBUG | INFO | WARN | ERROR

# ========= TELEGRAM =========
telegram:
  enabled: true
  # Các event nhận alert (bỏ event nào không cần).
  # Loại: ENTRY, PARTIAL_TP, FULL_TP, STOP_LOSS, KILL_SWITCH, REBALANCE,
  #       OPPORTUNITY_MISSED, LIQUIDATION_WARN, FUNDING_HIGH,
  #       CONFIG_RELOADED, ERROR, DAILY_REPORT, WEEKLY_REPORT, MONTHLY_REPORT,
  #       APP_START, APP_STOP
  alertEvents:
    - ENTRY
    - PARTIAL_TP
    - FULL_TP
    - STOP_LOSS
    - KILL_SWITCH
    - REBALANCE
    - OPPORTUNITY_MISSED
    - LIQUIDATION_WARN
    - FUNDING_HIGH
    - CONFIG_RELOADED
    - ERROR
    - DAILY_REPORT
    - WEEKLY_REPORT
    - MONTHLY_REPORT
    - APP_START
    - APP_STOP

# ========= PAPER-TRADE (DRY-RUN) =========
# Khi enabled=true: bot KHÔNG gọi endpoint trade thật của Binance. Mua/bán được giả lập
# trên số dư ảo lưu ở data/paper_account.json. Giá fill lấy real-time từ ticker public,
# áp slippage + fee để mô phỏng. Vẫn ghi log/JSONL/Telegram bình thường để đánh giá hiệu quả.
#
# Mục đích: chạy thử chiến lược một thời gian xem có lợi nhuận trước khi đưa vào trade thật.
# Khi muốn đổi về live: đặt enabled=false, xoá data/paper_account.json (tuỳ ý), restart.
paperTrade:
  enabled: true                          # true = paper-trade (mặc định để đánh giá), false = trade thật
  initialUsdtBalance: 300.0              # Vốn ảo USDT khi tạo paper account lần đầu (cũ 100 — nâng để có dư địa giữ 2 lệnh đồng thời + reserveFund đệm)
  feeRate: 0.001                         # Phí mỗi lệnh (0.1% = Spot taker fee chuẩn của Binance)
  slippagePct: 0.05                      # Slippage giả lập (% so ticker). Buy ăn cao hơn, sell thấp hơn.

# ========= RECOVERY / REHYDRATE =========
# Khi bật + state.json trống (user xoá ./data) + ví có coin → bot tạo Position
# với entryPrice = giá hiện tại lúc start ("coi như mua lại"). TP/SL/trailing sẽ
# manage forward từ mốc đó. Bot KHÔNG biết entry thật trước đó.
#
# RỦI RO: coin user đang hodl dài hạn sẽ bị bot manage → có thể bán ở partial TP.
# Default false để đảm bảo an toàn - user phải chủ động bật.
recovery:
  rehydrateOnStart: false              # true = rehydrate khi detect orphan
  minAssetValueUsdt: 1.0               # Coin < 1 USDT giá trị: skip (dust)
  onlyWhenStateEmpty: true             # Chỉ chạy khi state.positions rỗng

# ========= DYNAMIC CONFIG =========
dynamic:
  hotReload: true                       # true = sửa file YAML bot tự reload
  reloadDebounceMs: 2000                # Gom các event ghi file liên tiếp
  telegramControl: true                 # true = nhận lệnh /pause /resume /reload /closeAll /status qua Telegram

# ========= PER-SYMBOL OVERRIDE (tuỳ chọn) =========
# Thường để trống. Nếu muốn override riêng từng coin → tạo file symbols.yml
# cạnh jar với dạng:
#
#   DOGEUSDT:
#     leverage: 3
#     exit:
#       takeProfitPct: 8.0
#       stopLossPct: 4.0
#
# File symbols.yml sẽ override field `symbols` dưới đây.
symbols: {}
